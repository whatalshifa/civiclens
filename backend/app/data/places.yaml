# Seats, the people who hold them, and which PIN codes fall in which seats.
#
# A hand-checked sample: about twenty areas across states and parties. The data pipeline adds every
# other Lok Sabha seat from the Lok Sabha's member list (generated/lok-sabha.csv); an entry here
# always wins over a generated one, and the pipeline reports any difference between the two.
# Rules for adding anything here:
#   * Every seat, person, fact and PIN link names a `source` from sources.yaml.
#   * A representative's `elected_on` is the day their source (an election result) was declared.
#   * Names and parties are written the way the Election Commission writes them, in full.
#   * Order is by state and seat name. Nothing is ordered or styled by party.

