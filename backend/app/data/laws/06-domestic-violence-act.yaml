id: dv-act-2005
title: The Protection of Women from Domestic Violence Act, 2005
short_name: Domestic Violence Act
year: 2005
citation: Act No. 43 of 2005
keywords: domestic violence dv woman
unit: Section
source: india-code
summary: >-
  Gives women facing violence at home fast, civil remedies from a Magistrate: protection
  orders, the right to keep living in the home, money for expenses and maintenance, and
  custody of children. Breaking a protection order is a crime.
sections:
  - number: 2(a)
    title: Who can ask for help
    keywords: woman wife live in partner mother sister daughter aggrieved person
    summary: >-
      An "aggrieved person" is any woman who is or has been in a domestic relationship with
      the respondent and says she has faced domestic violence. A domestic relationship
      includes marriage, a relationship like marriage, and living together as family
      members related by blood, adoption or marriage.

  - number: "3"
    title: What domestic violence means
    keywords: domestic violence abuse physical sexual verbal emotional economic dowry harassment
    summary: >-
      Domestic violence covers physical, sexual, verbal and emotional abuse, and economic
      abuse such as taking away money, property or the things she needs. Harassing a woman or
      her relatives for dowry is also domestic violence.

  - number: "8"
    title: Protection Officers
    keywords: protection officer help district who to contact
    summary: >-
      State governments must appoint Protection Officers in each district. They help women
      make applications to the Magistrate, find shelter, medical help and legal aid, and
      make sure orders are carried out.

  - number: "12"
    title: Applying to a Magistrate
    keywords: apply magistrate court application hearing three days 60 days how to
    summary: >-
      The woman, a Protection Officer or anyone else on her behalf can apply to a Magistrate.
      The first hearing should usually be within three days of the application, and the
      Magistrate should try to decide within 60 days.

  - number: "17"
    title: Right to live in the shared home
    keywords: home house shared household evicted thrown out residence in laws
    summary: >-
      A woman in a domestic relationship has the right to live in the shared household,
      whether or not she owns any part of it. She cannot be evicted from it except by
      following the law.

  - number: "18"
    title: Protection orders
    keywords: protection order stop violence contact restraining order
    summary: >-
      The Magistrate can order the respondent to stop any act of domestic violence, stay away
      from her workplace or school, stop contacting her, and not take away her assets or
      shared bank accounts.

  - number: "19"
    title: Residence orders
    keywords: residence order home stay rent alternative accommodation
    summary: >-
      The Magistrate can order that she not be removed from the shared household, that the
      respondent leave it, or that he pay for alternative accommodation of the same standard.

  - number: "20"
    title: Money for losses and maintenance
    keywords: maintenance money expenses medical loss earnings compensation
    summary: >-
      The Magistrate can order the respondent to pay for expenses and losses caused by the
      violence, including lost earnings, medical costs and damaged property, and to pay
      maintenance for her and her children.

  - number: "31"
    title: Breaking a protection order is a crime
    keywords: breach violation protection order punishment jail fine
    summary: >-
      Breaching a protection order can be punished with up to one year in jail, a fine of up
      to ₹20,000, or both.
