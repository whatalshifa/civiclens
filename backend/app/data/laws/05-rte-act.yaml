id: rte-act-2009
title: The Right of Children to Free and Compulsory Education Act, 2009
short_name: RTE Act
year: 2009
citation: Act No. 35 of 2009
keywords: rte school education
unit: Section
source: india-code
summary: >-
  Puts the right to education in Article 21A into practice. Every child aged 6 to 14 can study
  free in a neighbourhood school, private schools must keep a quarter of entry seats for
  children from weaker sections, and schools cannot charge capitation fees, test children for
  admission, or punish them physically.
sections:
  - number: "3"
    title: Free and compulsory education for every child aged 6 to 14
    keywords: free education school child 6 14 fees neighbourhood school
    summary: >-
      Every child aged six to fourteen has the right to free and compulsory education in a
      neighbourhood school until finishing elementary education (class 8). The child cannot
      be charged any fee or expense that would stop them from completing it. Children with
      disabilities have the same right.

  - number: "4"
    title: Children who never joined or dropped out
    keywords: dropout out of school admission age appropriate class special training
    summary: >-
      A child over six who never went to school, or left before finishing, must be admitted
      to the class right for their age, and given special training to catch up. They remain
      entitled to free education even after turning fourteen, until they finish elementary
      education.

  - number: 12(1)(c)
    title: 25% seats in private schools
    keywords: 25 percent private school seats ews weaker section disadvantaged admission free quota
    summary: >-
      Private unaided schools (and certain other kinds of school) must admit, in class 1 or
      pre-school, at least 25% of their entry class from weaker sections and disadvantaged
      groups in the neighbourhood, and educate them free until class 8. The government pays
      the school back. Each state sets its own rules and online admission process.

  - number: "13"
    title: No capitation fee, no admission tests
    keywords: capitation fee donation money interview test screening parents private school
    summary: >-
      No school may collect a capitation fee (donation) or put a child or their parents
      through any screening procedure for admission. A school that takes a capitation fee
      can be fined up to ten times the fee; screening is fined ₹25,000 the first time and
      ₹50,000 for each repeat.

  - number: "14"
    title: No refusal for lack of a birth certificate
    keywords: birth certificate age proof documents admission refused
    summary: >-
      No child can be refused admission because they don't have proof of age. Age can be
      shown by a birth certificate or other documents the rules allow.

  - number: "15"
    title: Admission at any time
    keywords: admission late mid year refused
    summary: >-
      A child must be admitted at the start of the school year or within the extended period
      set by the rules. A child who comes later must still be admitted.

  - number: "16"
    title: Holding back and expulsion
    keywords: fail detention held back expel exam class 5 class 8
    summary: >-
      No child can be expelled from school until they finish elementary education. Since a
      2019 amendment, there are regular exams in classes 5 and 8; a child who fails gets extra
      teaching and a re-exam within two months, and the government may allow a child who
      fails again to be held back.

  - number: "17"
    title: No physical punishment or harassment
    keywords: beating corporal punishment teacher harassment hit child abuse
    summary: >-
      No child may be given physical punishment or subjected to mental harassment. A person
      who does this faces disciplinary action under the service rules that apply to them.

  - number: "32"
    title: Where to complain
    keywords: complaint grievance local authority commission child rights school refuses
    summary: >-
      Anyone with a complaint about a child's rights under this Act can write to the local
      authority, which must decide it within three months after hearing the people
      involved. If unhappy, you can appeal to the State Commission for Protection of Child
      Rights.
