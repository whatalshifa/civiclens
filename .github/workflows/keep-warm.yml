# Keeps the CivicLens API awake while recruiters and reviewers are most likely to look, so the
# first visit doesn't wait ~50 seconds for a cold start.
#
# Every 10 minutes, Monday to Friday, 09:30–18:30 IST (04:00–12:59 UTC).
#
# Budget: Render's free tier allows 750 instance hours a month per workspace, and three apps share
# it. This window keeps one app awake for about 200 hours a month, so all three fit (about 600).
name: Keep the API warm

on:
  schedule:
    - cron: "*/10 4-12 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # /api/health answers once the database does. A cold start can take most of a minute, and
      # a slow or failed ping must never mark the run as failed: `|| true`.
      - name: Ping the health check
        run: curl -fsS --max-time 90 https://civiclens-api-jwu3.onrender.com/api/health || true
