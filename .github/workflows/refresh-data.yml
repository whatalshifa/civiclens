name: Refresh data

# Every Monday, fetch the Lok Sabha's member list and each MP's record (questions, attendance and
# MPLADS fund) and, if anything changed, open a pull request for a person to review. Nothing
# reaches the website until that pull request is merged.
#
# One-time setup: Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests" must be ticked, or the last step can't open the pull request.

on:
  schedule:
    - cron: "30 3 * * 1" # 09:00 India time, Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  members:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 2s --health-retries 15
    env:
      CL_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      BRANCH: data/lok-sabha-refresh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Fetch the Lok Sabha's member list
        run: python -m pipeline members --report "$RUNNER_TEMP/report.md"

      # About 1,100 requests to sansad.in and the MPLADS dashboard, spaced a second apart. If either
      # site is down, last week's records stay and the member refresh still goes ahead.
      - name: Fetch each MP's questions, attendance and MPLADS fund
        run: |
          python -m pipeline record --report "$RUNNER_TEMP/record.md" || {
            git checkout -- app/data/generated/lok-sabha-record.csv app/data/generated/sources-lok-sabha-record.yaml
            echo "The MPs' records couldn't be fetched this week, so last week's stay." > "$RUNNER_TEMP/record.md"
          }

      - name: Show the reports on this run's page
        run: cat "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/record.md" >> "$GITHUB_STEP_SUMMARY"

      # Hand-checked seats (places.yaml) are never changed automatically. If the official list
      # disagrees with one, say so in an issue, since there's no data change to put in a pull request.
      - name: Flag hand-checked seats that differ from the official list
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Data: hand-checked seats differ from the Lok Sabha's list"
        run: |
          # One open issue at a time: a later run doesn't repeat it every week.
          if grep -q "These differ from the official list" "$RUNNER_TEMP/report.md" &&
             [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/report.md"
          fi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- app/data/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to the data files." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- app/data/generated
          fi

      # Pull requests opened with GITHUB_TOKEN don't start the CI workflow, so the checks that
      # matter for data run here, before the pull request exists.
      - name: Check the new data loads and passes the tests
        if: steps.diff.outputs.changed == 'true'
        run: pytest -q

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add app/data/generated
          git commit -m "Refresh Lok Sabha members and records ($(date -u +%F))"
          git push --force origin "$BRANCH"

          {
            echo "The weekly data check found changes in the Lok Sabha's members or their records."
            echo "Please compare member changes with https://sansad.in/ls/members before merging."
            echo "The backend tests passed on this data in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            cat "$RUNNER_TEMP/record.md"
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "Data: Lok Sabha members and records" --body-file "$RUNNER_TEMP/body.md"
          fi
