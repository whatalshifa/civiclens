# Temporary: checks which data sources the pipeline can reach from GitHub Actions. Deleted after.
name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: "Mozilla/5.0 (X11; Linux x86_64) CivicLens data pipeline (https://github.com/whatalshifa/civiclens)"
    steps:
      - name: MPLADS dashboard scripts
        continue-on-error: true
        run: |
          curl -s -m 60 -A "$UA" https://mplads.mospi.gov.in/libs/simplegrid/loksaba.js | head -c 6000; echo
          echo "=== preLogin"
          curl -s -m 60 -A "$UA" https://mplads.mospi.gov.in/libs/simplegrid/preLoginDashboard.js -o p.js
          grep -nE "url|ajax|fetch|\.json|getJSON|\.zul|Servlet|/rest/|/api" p.js | head -60
      - name: Sansad question and attendance API names in the app bundles
        continue-on-error: true
        run: |
          for page in https://sansad.in/ls/questions/questions-and-answers https://sansad.in/ls/members https://sansad.in/ls/members/attendance; do
            curl -s -m 60 -A "$UA" "$page" -o p.html -w "== $page %{http_code}\n"
            for js in $(grep -oE 'src="/ls/_next/[^"]+\.js"' p.html | sed 's/src="//;s/"$//'); do
              curl -s -m 60 -A "$UA" "https://sansad.in$js" -o b.js
              grep -oE '.{0,80}(api_ls|qetFiltered|ttendance)[^"`]{0,200}' b.js | head -20
            done
          done 2>&1 | sort -u | head -150
      - name: Sansad questions with different member filters
        continue-on-error: true
        run: |
          for q in "mpCode=5265" "memberCode=5265" "mpsno=5265" "member=5265" "mpNo=5265"; do
            u="https://sansad.in/api_ls/question/qetFilteredQuestionsAns?loksabhaNo=18&$q&page=1&size=3&locale=en"
            echo "== $q"; curl -s -m 60 -A "$UA" "$u" | python3 -c "import json,sys; d=json.load(sys.stdin); print([ (x['member'], x['date']) for x in d[0]['listOfQuestions']][:3], {k:v for k,v in d[0].items() if k!='listOfQuestions'})" 2>&1 | head -c 800; echo
          done
