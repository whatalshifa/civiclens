# Temporary: runs the new record step from GitHub Actions, since the sandbox can't reach the sites. Deleted after.
name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: mp-record
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - working-directory: backend
        run: |
          pip install -q -r requirements.txt
          python -m pipeline record --report report.md
          echo "=== CSV"; cat app/data/generated/lok-sabha-record.csv
          echo "=== SOURCES"; cat app/data/generated/sources-lok-sabha-record.yaml
