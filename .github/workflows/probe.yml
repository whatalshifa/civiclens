# Temporary: checks which data sources the pipeline can reach from GitHub Actions. Deleted after.
name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: "CivicLens data pipeline (https://github.com/whatalshifa/civiclens)"
    steps:
      - name: Sansad members (public fields only)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, os
          rows = []
          page = 1
          while True:
              url = f"https://sansad.in/api_ls/member?loksabha=18&page={page}&size=100"
              req = urllib.request.Request(url, headers={"User-Agent": os.environ["UA"]})
              data = json.load(urllib.request.urlopen(req, timeout=60))
              for m in data["membersDtoList"]:
                  rows.append((m["stateName"], m["constName"], m["status"], m["initial"], m["mpFirstLastName"], m["partyFname"], m.get("categoryCode")))
              if page >= data["metaDatasDto"]["totalPages"]:
                  break
              page += 1
          print("TOTAL", len(rows), "keys:", sorted(data["membersDtoList"][0].keys()))
          for r in sorted(rows):
              print("|".join(str(x).strip() for x in r))
          PY
      - name: Wikidata 18th Lok Sabha terms
        continue-on-error: true
        run: |
          cat > q.rq <<'Q'
          SELECT ?districtLabel ?personLabel ?electedLabel ?start ?end WHERE {
            ?person p:P39 ?st . ?st pq:P2937 wd:Q123052644 .
            OPTIONAL { ?st pq:P768 ?district }
            OPTIONAL { ?st pq:P2715 ?elected }
            OPTIONAL { ?st pq:P580 ?start }
            OPTIONAL { ?st pq:P582 ?end }
            SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
          }
          Q
          curl -s -m 120 -G https://query.wikidata.org/sparql --data-urlencode query@q.rq -H "Accept: text/csv" -A "$UA" -o wd.csv
          wc -l wd.csv; cut -d, -f3 wd.csv | sort | uniq -c | sort -rn | head -20; grep -v "2024 Indian general election" wd.csv | head -40
      - name: ECI results again
        continue-on-error: true
        run: |
          for i in 1 2 3; do curl -s -m 60 -A "$UA" -w "HTTP %{http_code}\n" https://results.eci.gov.in/PcResultGenJune2024/index.htm -o eci.html && break; sleep 5; done; wc -c eci.html; grep -o 'href="[^"]*"' eci.html | sort -u | head -30
